<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a98af0">
<title>Stash | Savings Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2fb;--card:#fff;--ink:#271f3d;--mute:#867da0;--line:#ebe5f6;--acc:#a98af0;--acc2:#f58fc4;--ok:#3bb77e;--bad:#e8596f;--sh:0 6px 24px rgba(110,80,190,.10)}
@media(prefers-color-scheme:dark){:root{--bg:#14111d;--card:#1e1930;--ink:#f2edff;--mute:#9b93b6;--line:#2d2644;--sh:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3,h4,.num{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
small{color:var(--mute)}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.top h1{font-size:30px;font-weight:800}
.top h1 span{display:inline-block;animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg) scale(1.1)}}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600;padding:12px 20px;border-radius:14px;box-shadow:0 6px 16px rgba(169,138,240,.4);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
.ghost{padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;transition:background .15s,transform .15s}
.ghost:hover{background:var(--line)}.ghost:active{transform:scale(.96)}
.danger{color:var(--bad)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#view{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);cursor:pointer;transition:transform .2s}
.card:hover{transform:translateY(-3px)}.card:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.sp{justify-content:space-between;margin-top:10px}
.card h3{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct{font-size:20px}
.ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px;object-fit:cover;flex:none}
.ico.big{width:84px;height:84px;font-size:42px;border-radius:26px}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}
.bar.lg{height:16px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c,var(--acc)),var(--acc2));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rec{display:block;margin-top:8px}
.empty{text-align:center;padding:60px 20px}.empty .em{font-size:56px;display:block;margin-bottom:10px}
.hero{text-align:center;padding:10px 0 4px}
.hero h2{font-size:26px;margin:12px 0 4px}.hero .num{font-size:44px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:16px;margin-top:2px}
.note{background:linear-gradient(135deg,rgba(169,138,240,.16),rgba(245,143,196,.16));border:1.5px dashed var(--acc);border-radius:16px;padding:14px 16px;margin-bottom:16px;font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.acts .btn{flex:1;min-width:160px}
h4{font-size:18px;margin-bottom:10px}
ul{list-style:none}
li{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px}
li.new{animation:in .4s both}
.dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:rgba(59,183,126,.15);color:var(--ok);flex:none}
.dot.neg{background:rgba(232,89,111,.15);color:var(--bad)}
li small{display:block}
.x{width:30px;height:30px;border-radius:9px;color:var(--mute)}.x:hover{background:var(--line);color:var(--bad)}
.foot{display:flex;gap:8px;justify-content:center;margin-top:26px}
dialog{border:0;border-radius:24px;background:var(--card);color:var(--ink);width:min(480px,calc(100vw - 24px));max-height:92vh;padding:22px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog[open]{animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
dialog::backdrop{background:rgba(20,10,40,.45);backdrop-filter:blur(4px)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
dialog h2{font-size:22px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
input,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input[type=color]{padding:2px;height:36px;width:44px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs,.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.tabs button,.seg label{flex:1;text-align:center;padding:8px;border-radius:9px;font-weight:600;margin:0;font-size:14px;cursor:pointer}
.tabs .on,.seg input:checked+span{background:var(--card);box-shadow:var(--sh)}
.seg label{padding:0}.seg input{display:none}.seg span{display:block;padding:9px;border-radius:9px;transition:.2s}
.seg input[value=add]:checked+span{background:var(--ok);color:#fff}
.seg input[value=deduct]:checked+span{background:var(--bad);color:#fff}
.picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.picker button{width:38px;height:38px;border-radius:11px;font-size:20px;background:var(--bg);transition:transform .15s}
.picker button:hover{transform:scale(1.15)}
.picker .sw{width:26px;height:26px;border-radius:50%}
.picker .sel{outline:3px solid var(--acc);outline-offset:1px}
.prev{display:flex;align-items:center;gap:12px;margin-top:12px}
.hide{display:none!important}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600}.chk label{margin:0}
.btns{display:flex;gap:8px;margin-top:20px}.btns>*{flex:1}
.hero .ico{margin:0 auto}
#toast{position:fixed;inset:auto;top:calc(12px + env(safe-area-inset-top,0px));left:50%;margin:0;border:0;width:max-content;max-width:90vw;height:auto;overflow:visible;transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:var(--sh);transition:transform .4s cubic-bezier(.2,1.2,.4,1);z-index:99}
#toast.show{transform:translate(-50%,0)}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;font-size:30px;padding:0}
.top .r{display:flex;gap:8px;align-items:center}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overflow-x:hidden}
input,select{font-size:16px;min-height:46px;min-width:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;text-overflow:ellipsis}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;min-height:0;width:22px;height:22px}
input[type=color]{-webkit-appearance:auto;appearance:auto;min-height:36px}
input[type=file]{font-size:14px;padding:9px}
input[type=date],input[type=time]{display:block;text-align:left}
.two>div{min-width:0}
@media(hover:none){.card:hover,.btn:hover,.picker button:hover{transform:none}}
@media(max-width:520px){
.wrap{padding:16px 14px 120px}
.top h1{font-size:26px}
#acct{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .num{font-size:38px}.ico.big{width:72px;height:72px;font-size:36px}
.acts .btn{min-width:100%}
dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:26px 26px 0 0;max-height:90dvh;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
dialog[open]{animation:sheet .35s cubic-bezier(.2,.9,.3,1)}
.btns .btn,.btns .ghost{min-height:48px}
}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
#acct{padding:8px 12px;font-size:13px}
@media(max-width:520px){#newTop{display:none}}
body{padding-top:0}
.wrap{--px:max(16px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));padding:16px var(--px) 120px}
.top{position:sticky;top:0;z-index:20;margin:-16px calc(var(--px)*-1) 18px;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--px) 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card h3{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
input[type=date],input[type=time]{width:100%;max-width:100%;min-width:0}
::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
input[type=color]{-webkit-appearance:none;appearance:none;width:38px;height:38px;min-height:0;padding:0;border:0;border-radius:50%;background:none;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:3px solid var(--line);border-radius:50%}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:26px;height:26px;min-height:0;flex:none;border-radius:8px;border:2px solid var(--mute);background:var(--bg);display:grid;place-items:center;transition:.2s}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
input[type=checkbox]:checked::after{content:"✓";color:#fff;font-size:16px;font-weight:700}
#prev .ico.big{width:56px;height:56px;font-size:30px;border-radius:18px}
@media(hover:none) and (max-width:520px){.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---------- Stashley ---------- */
.foot{flex-wrap:wrap}
#stashley{position:fixed;inset:0 auto auto 0;margin:0;padding:0;border:0;background:none;overflow:visible;width:52px;height:52px;color:var(--ink);transform:translate(-120px,-120px);pointer-events:none;will-change:transform}
.sg-cat{pointer-events:auto;display:block;width:52px;height:52px;padding:0;border-radius:50%;position:relative;-webkit-tap-highlight-color:transparent;transition:scale .15s}
.sg-cat:active{scale:.9}
.sg-hover{display:block;width:100%;height:100%;position:relative;animation:sgbob 2.8s ease-in-out infinite}
.sg-tilt{display:block;width:100%;height:100%;position:relative}
.sg-face{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;line-height:1;opacity:0;transform:scale(.55) rotate(-14deg);transition:opacity .22s ease,transform .32s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 5px 6px rgba(70,40,140,.28))}
.sg-face.on{opacity:1;transform:none}
.sg-shadow{position:absolute;left:13px;right:13px;bottom:-9px;height:8px;border-radius:50%;background:rgba(40,20,80,.24);filter:blur(2px);pointer-events:none;animation:sgsh 2.8s ease-in-out infinite}
@keyframes sgbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sgsh{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.7);opacity:.5}}
.sg-bubble{position:absolute;bottom:calc(100% + 12px);width:max-content;max-width:240px;background:var(--card);color:var(--ink);padding:10px 13px;border-radius:16px;box-shadow:var(--sh),0 0 0 1.5px var(--line);font:500 14px/1.38 Figtree,system-ui,sans-serif;opacity:0;transform:translateY(6px) scale(.94);transition:opacity .2s ease,transform .26s cubic-bezier(.2,1.3,.4,1);pointer-events:none;cursor:pointer}
.sg-bubble.show{opacity:1;transform:none;pointer-events:auto}
.sg-bubble.l{left:0;transform-origin:bottom left}
.sg-bubble.r{right:0;transform-origin:bottom right}
.sg-bubble.below{bottom:auto;top:calc(100% + 12px)}
.sg-bubble::after{content:"";position:absolute;width:12px;height:12px;background:var(--card);border-radius:3px;transform:rotate(45deg);bottom:-5px}
.sg-bubble.l::after{left:20px}.sg-bubble.r::after{right:20px}
.sg-bubble.below::after{bottom:auto;top:-5px}
.sg-conf{position:absolute;left:23px;top:23px;width:7px;height:9px;border-radius:2px;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1><span>🐾</span> Stash</h1><div class="r"><button class="ghost hide" id="acct"></button><button class="btn hide" id="newTop">+ New goal</button></div></div>
  <main id="view"></main>
</div>
<button class="btn fab" id="fab" aria-label="New goal">+</button>
<div id="toast" role="status" popover="manual"></div>

<dialog id="gd">
  <form id="gf" method="dialog">
    <h2 id="gt">New goal</h2>
    <label for="gn">Goal name</label>
    <input id="gn" required maxlength="40" placeholder="New PC, trip, emergency fund...">
    <label>Icon</label>
    <div class="tabs"><button type="button" data-t="emoji" class="on">Emoji + color</button><button type="button" data-t="photo">Photo</button></div>
    <div id="tEmoji"><div class="picker" id="emojis"></div><div class="picker" id="swatches"></div></div>
    <div id="tPhoto" class="hide">
      <label for="gfile">Upload from this device</label><input id="gfile" type="file" accept="image/*">
      <label for="gurl">Or paste an image link</label><input id="gurl" type="url" placeholder="https://...">
    </div>
    <div class="prev"><span id="prev"></span><small>Preview</small></div>
    <div class="two">
      <div><label for="gamt">Target amount</label><input id="gamt" type="number" min="0.01" step="any" required inputmode="decimal"></div>
      <div><label for="gcur">Currency</label><select id="gcur"></select></div>
    </div>
    <div class="two">
      <div><label for="gdate">Target date (optional)</label><input id="gdate" type="date"></div>
      <div><label for="gfreq">Savings frequency</label><select id="gfreq"><option value="daily">Daily</option><option value="weekly" selected>Weekly</option><option value="biweekly">Every 2 weeks</option><option value="monthly">Monthly</option></select></div>
    </div>
    <div class="chk"><input type="checkbox" id="grem"><label for="grem">Remind me to save (optional)</label></div>
    <div class="two hide" id="remBox"><div><label for="gday">Day</label><select id="gday"></select></div><div><label for="gtime">Time</label><input type="time" id="gtime" value="18:00"></div></div>
    <div class="btns"><button type="button" class="ghost" data-close>Cancel</button><button class="btn" id="gsave">Save goal</button></div>
  </form>
</dialog>

<dialog id="cd">
  <form id="cf" method="dialog">
    <h2>Add contribution</h2>
    <div class="seg"><label><input type="radio" name="ct" value="add" checked><span>Add</span></label><label><input type="radio" name="ct" value="deduct"><span>Deduct</span></label></div>
    <label for="camt" id="camtL">Amount</label><input id="camt" type="number" min="0.01" step="any" required inputmode="decimal">
    <label for="cdate">Date</label><input id="cdate" type="date" required>
    <label for="cnote">Note (optional)</label><input id="cnote" maxlength="80" placeholder="Where did it come from?">
    <div class="btns"><button type="button" class="ghost" data-close>Cancel</button><button class="btn">Save</button></div>
  </form>
</dialog>
<input type="file" id="imp" accept="application/json" class="hide">

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('stash.v1'))||{goals:[]}}catch{S={goals:[]}}
const save=()=>{S.ts=Date.now();localStorage.setItem('stash.v1',JSON.stringify(S));window.cloudPush&&cloudPush()};
window.stash={get:()=>S,set:d=>{S=d;localStorage.setItem('stash.v1',JSON.stringify(S));render()}};
const FREQ={daily:['every day',1],weekly:['every week',7],biweekly:['every 2 weeks',14],monthly:['every month',30.4375]};
const EMOJI=['💰','🎮','💻','📱','🎧','✈️','🏠','🚗','🎓','🎁','📷','👟','🐶','💍','🛡️','🎸','🏝️','⌚','🪙','⭐'];
const COLORS=['#a98af0','#f58fc4','#ff9f7a','#ffd166','#6fd3a0','#5fc7e8','#7b8cff','#9aa0b4'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const money=(n,c)=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(n)}catch{return c+' '+n.toFixed(2)}};
const saved=g=>g.logs.reduce((a,l)=>a+l.amt,0);
const pctOf=g=>Math.max(0,Math.min(100,saved(g)/g.target*100));
const fdate=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const sorted=g=>[...g.logs].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
const ico=(g,big)=>g.icon.src?`<img class="ico ${big?'big':''}" src="${esc(g.icon.src)}" alt="">`:`<div class="ico ${big?'big':''}" style="background:${esc(g.icon.color)}33">${esc(g.icon.emoji)}</div>`;

/* ---------- views ---------- */
const view=$('#view');
function render(){
  const m=location.hash.match(/^#g\/(\d+)/),g=m&&S.goals.find(x=>x.id==m[1]);
  view.style.animation='none';void view.offsetWidth;view.style.animation='';
  if(g){view.innerHTML=detail(g);$('#fab').classList.add('hide');$('#newTop').classList.add('hide')}
  else{if(m)location.hash='';view.innerHTML=home();$('#fab').classList.remove('hide');$('#newTop').classList.remove('hide')}
  setTimeout(()=>document.querySelectorAll('.bar i').forEach(e=>e.style.width=e.dataset.w+'%'),60);
}
function home(){
  if(!S.goals.length)return`<div class="empty"><span class="em">🐱</span><h2>No goals yet</h2><p><small>Create your first savings goal to start tracking.</small></p><br><button class="btn" data-a="new">Create a goal</button></div>${foot()}`;
  return S.goals.map(g=>{
    const l=sorted(g)[0],s=saved(g);
    return`<article class="card" data-a="open" data-id="${g.id}" tabindex="0">
      <div class="row">${ico(g)}<div class="grow"><h3>${esc(g.name)}</h3><small>${g.date?'Target date: '+fdate(g.date):'No target date'}</small></div><b class="pct num">${Math.round(pctOf(g))}%</b></div>
      <div class="bar"><i data-w="${pctOf(g)}" style="--c:${esc(g.icon.color)}"></i></div>
      <div class="row sp"><span><b>${money(s,g.currency)}</b> <small>saved of ${money(g.target,g.currency)}</small></span></div>
      <small class="rec">${l?`Latest: ${l.amt<0?'-':'+'}${money(Math.abs(l.amt),g.currency)} on ${fdate(l.date)}`:'No contributions yet'}</small></article>`}).join('')+foot();
}
const foot=()=>`<div class="foot"><button class="ghost" data-a="exp">Export backup</button><button class="ghost" data-a="imp">Import backup</button><button class="ghost" data-a="mascot" id="mascotBtn" aria-pressed="true">Stashley: on</button></div>`;
function estimate(g){
  const rem=g.target-saved(g);
  if(rem<=0)return'You hit your goal. Time to celebrate 🎉';
  if(!g.date)return null;
  const days=(new Date(g.date+'T23:59:59')-new Date())/864e5;
  if(days<=0)return`Your target date has passed. You still need ${money(rem,g.currency)}.`;
  const [lab,per]=FREQ[g.freq],n=Math.max(1,Math.ceil(days/per));
  return`Save about <b>${money(Math.ceil(rem/n*100)/100,g.currency)}</b> ${lab} for ${n} ${n>1?'saving sessions':'saving session'} to reach your goal by ${fdate(g.date)}.`;
}
const stat=(a,b)=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`;
function detail(g){
  const s=saved(g),est=estimate(g),logs=sorted(g);
  return`<button class="ghost" data-a="back">Back</button>
  <section class="hero">${ico(g,1)}<h2>${esc(g.name)}</h2><div class="num">${money(s,g.currency)}</div><small>of ${money(g.target,g.currency)} (${Math.round(pctOf(g))}%)</small>
  <div class="bar lg"><i data-w="${pctOf(g)}" style="--c:${esc(g.icon.color)}"></i></div></section>

}

$('#grem').onchange=async e=>{

let editing=null;

/* ---------- contribution form ---------- */
function openContrib(){const g=curGoal();$('#camtL').textContent='Amount ('+g.currency+')';$('#camt').value='';$('#cnote').value='';$('#cdate').value=today();$('#cf').ct.value='add';$('#cd').showModal()}

/* ---------- reminders ---------- */
function toast(m){

  try{t.hidePopover()}catch{}try{t.showPopover()}catch{}
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  toast.t=setTimeout(()=>{t.classList.remove('show');toast.h=setTimeout(()=>{try{t.hidePopover()}catch{}},450)},3200);
}
function check(){
  const d=new Date(),hm=d.toTimeString().slice(0,5),key=d.toDateString();
  let f={};try{f=JSON.parse(localStorage.getItem('stash.fired'))||{}}catch{}
  S.goals.forEach(g=>{const r=g.remind;
    if(r&&r.on&&r.day===d.getDay()&&hm>=r.time&&f[g.id]!==key){

setInterval(check,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});

<script>
(()=>{
/* ---------- Stashley, the savings cat (no AI, just rules) ---------- */
const FACES=['😺','😸','😹','😻','😼','😽','🙀','😿','😾'];
const W=52;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const dialogOpen=()=>!!document.querySelector('dialog[open]');
const SG={on:(()=>{try{return localStorage.getItem('stash.mascot')!=='off'}catch{return true}})()};

/* ---- element ---- */
const el=document.createElement('div');
el.id='stashley';el.setAttribute('popover','manual');el.style.display='none';
el.innerHTML='<div class="sg-bubble l" aria-live="polite"></div><button type="button" class="sg-cat" aria-label="Stashley the cat. Tap for another message"><span class="sg-hover"><span class="sg-tilt"><span class="sg-face on">😺</span><span class="sg-face"></span></span></span></button><i class="sg-shadow"></i>';
document.body.appendChild(el);
const bub=el.querySelector('.sg-bubble'),tilt=el.querySelector('.sg-tilt'),faces=[...el.querySelectorAll('.sg-face')];

/* ---- state ---- */
const seen={};
let tok=0,bt,homeT,ct,idleT,rt,fi=0;
let lastSay=0,lastAct=0,lastDed=0,lastText='',lastKey2='',taps=[];
let shown=false,flying=false,anim=null,bubbleOn=false;
let pos={x:-120,y:-120};
const cur={sel:null,mode:'above-r'};

/* ---- face (only the nine cat faces) ---- */
function setFace(f){
  if(!FACES.includes(f))f='😺';
  if(faces[fi].textContent===f)return;
  const a=faces[fi];fi=1-fi;const b=faces[fi];
  b.textContent=f;a.classList.remove('on');b.classList.add('on');
}
const restFace=()=>Date.now()-lastDed<60000?'😿':'😺';

/* ---- positions ---- */
function setPos(x,y){pos={x,y};el.style.transform=`translate(${x}px,${y}px)`}
const rest=()=>({x:14,y:innerHeight-W-22});
function spot(sel,mode,follow){
  const vw=innerWidth,vh=innerHeight,dlg=!!sel&&sel[0]==='#';
  const top=dlg?6:((document.querySelector('.top')||{getBoundingClientRect:()=>({bottom:0})}).getBoundingClientRect().bottom+4);
  const t=sel&&document.querySelector(sel);
  if(t){
    const r=t.getBoundingClientRect();
    if(r.width&&(follow||(r.bottom>top&&r.top<vh))){
      const x=mode==='in-br'?r.right-W-6:r.right-W-4;
      const y=mode==='in-br'?r.bottom-W-6:r.top-W-4;
      return{x:clamp(x,8,vw-W-8),y:clamp(y,top,vh-W-(dlg?6:20))};
    }
  }
  return rest();
}
function placeBubble(p){
  const vw=innerWidth,right=(p.x+W/2)>vw/2,below=p.y<130;
  bub.classList.toggle('r',right);bub.classList.toggle('l',!right);bub.classList.toggle('below',below);
  bub.style.maxWidth=Math.max(140,Math.min(250,right?p.x+W-10:vw-p.x-10))+'px';
}
function reposition(){
  if(!shown||flying)return;
  const s=cur.sel?spot(cur.sel,cur.mode,true):rest();
  setPos(s.x,s.y);placeBubble(s);
}

/* ---- show / hide ---- */
function ensureShown(){
  if(shown)return;
  shown=true;el.style.display='';
  setPos(-90,rest().y-60);
  try{el.showPopover()}catch{}
}
function raise(){try{el.hidePopover()}catch{}try{el.showPopover()}catch{}}
function hideAll(){
  tok++;clearTimeout(bt);clearTimeout(homeT);hideBubble();
  shown=false;el.style.display='none';
  try{el.hidePopover()}catch{}
}
function showBubble(t){bub.textContent=t;placeBubble(pos);bub.classList.add('show');bubbleOn=true}
function hideBubble(){bub.classList.remove('show');bubbleOn=false}

/* ---- flight: a curved, fluttery path with banking and squash ---- */
function flyTo(x1,y1){
  return new Promise(res=>{
    const r=el.getBoundingClientRect(),x0=r.left,y0=r.top;
    if(anim){el.style.transform=`translate(${x0}px,${y0}px)`;anim.cancel();anim=null;flying=false}
    const dist=Math.hypot(x1-x0,y1-y0);
    if(dist<6){setPos(x1,y1);return res()}
    if(RM()){
      const a=el.animate([{opacity:1},{opacity:0}],{duration:120,fill:'forwards'});
      a.onfinish=()=>{setPos(x1,y1);const b=el.animate([{opacity:0},{opacity:1}],{duration:120,fill:'forwards'});b.onfinish=()=>{b.cancel();a.cancel();res()}};
      return;
    }
    const nx=-(y1-y0)/dist,ny=(x1-x0)/dist,bend=(Math.random()<.5?-1:1)*Math.min(120,dist*.3);
    const cx=(x0+x1)/2+nx*bend,cy=(y0+y1)/2+ny*bend-30;
    const N=26,frames=[];
    for(let k=0;k<=N;k++){
      const t=k/N,e=t*t*(3-2*t),u=1-e;
      let x=u*u*x0+2*u*e*cx+e*e*x1,y=u*u*y0+2*u*e*cy+e*e*y1;
      const w=Math.sin(t*Math.PI)*Math.sin(t*Math.PI*5)*5;
      x+=nx*w;y+=ny*w;
      frames.push({transform:`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`});
    }
    const dur=Math.min(1700,Math.max(750,550+dist*.85)),dir=x1>=x0?1:-1;
    flying=true;
    const a=el.animate(frames,{duration:dur,easing:'linear',fill:'forwards'});
    anim=a;
    tilt.animate([
      {transform:'rotate(0) scale(1)'},
      {transform:`rotate(${dir*14}deg) scale(1.08,.94)`,offset:.25},
      {transform:`rotate(${dir*6}deg) scale(.95,1.06)`,offset:.55},
      {transform:`rotate(${dir*10}deg) scale(1.06,.95)`,offset:.8},
      {transform:'rotate(0) scale(1)'}
    ],{duration:dur,easing:'ease-in-out'});
    a.onfinish=()=>{if(anim===a){setPos(x1,y1);a.cancel();anim=null;flying=false}res()};
    a.oncancel=()=>res();
  });
}
function confetti(n){
  if(RM())return;
  const cols=['#a98af0','#f58fc4','#ff9f7a','#ffd166','#6fd3a0','#5fc7e8'];
  for(let k=0;k<n;k++){
    const p=document.createElement('i');p.className='sg-conf';p.style.background=cols[k%cols.length];el.appendChild(p);
    const a=Math.random()*Math.PI*2,d=50+Math.random()*90,dx=Math.cos(a)*d,dy=Math.sin(a)*d-40;

      {transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*360}deg)`,opacity:1,offset:.45},
      {transform:`translate(${dx*1.1}px,${dy+120}px) rotate(${Math.random()*720}deg)`,opacity:0}
    ],{duration:1300+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>p.remove();
  }
}

/* ---- say: change face, fly to the anchor, then show the bubble ---- */
async function say(o){
  if(!SG.on&&!o.force)return;

  clearTimeout(bt);clearTimeout(homeT);hideBubble();
  lastSay=Date.now();lastText=o.msg;

  cur.sel=o.sel||null;cur.mode=o.mode||'above-r';
  showBubble(o.msg);
  if(o.fx==='confetti')confetti(40);else if(o.fx==='sparkle')confetti(14);
  if(o.fx==='zoom'){
    await sleep(1300);if(my!==tok)return;
    hideBubble();
    for(let k=0;k<3;k++){await flyTo(8+Math.random()*(innerWidth-W-16),80+Math.random()*(innerHeight-220));if(my!==tok)return}
    setFace(restFace());goHome();return;
  }
  const ms=clamp(2200+o.msg.length*60,3600,9000);
  bt=setTimeout(()=>{
    if(my!==tok)return;
    hideBubble();setFace(restFace());
    homeT=setTimeout(goHome,7000);
  },ms);
}
function goHome(){
  if(!SG.on||!shown||dialogOpen()||bubbleOn)return;
  cur.sel=null;const s=rest();flyTo(s.x,s.y);
}
bub.addEventListener('click',()=>{
  clearTimeout(bt);hideBubble();setFace(restFace());
  clearTimeout(homeT);homeT=setTimeout(goHome,5000);
});

/* ---- facts about a goal ---- */
function info(g){
  const s=saved(g),rem=g.target-s,pct=clamp(s/g.target*100,0,100),logs=sorted(g);
  let ded=0;for(const l of logs){if(l.amt<0)ded++;else break}
  const la=logs.find(l=>l.amt>0);
  const since=la?Math.round((Date.parse(today()+'T00:00')-Date.parse(la.date+'T00:00'))/864e5):null;
  const age=g.id>1e12?Math.floor((Date.now()-g.id)/864e5):0;
  let daysLeft=null,exp=null,per=null;
  if(g.date){
    const end=new Date(g.date+'T23:59:59').getTime();

      const [lab,p]=FREQ[g.freq]||FREQ.weekly,k=Math.max(1,Math.ceil(daysLeft/p));

    }

    ahead:exp!=null&&age>=3&&rem>0&&pct>0&&pct-exp>10};

const short=n=>n.length>22?n.slice(0,21)+'…':n;

  if(g){i=i||info(g);Object.assign(v,{name:short(g.name),pct:Math.round(i.pct),rem:money(Math.max(0,i.rem),g.currency),saved:money(i.s,g.currency),n:i.ded,days:i.daysLeft,since:i.since,per:i.per||''})}
  return v;
}
function ctx(){
  const m=location.hash.match(/^#g\/(\d+)/),g=m&&S.goals.find(x=>x.id==m[1]);
  return g?{scr:'detail',g,i:info(g)}:{scr:'home',goals:S.goals.map(g=>({g,i:info(g)}))};
}

/* ---- rules: [screen, priority, cooldown, test, messages, anchor] ---- */
const CARD=g=>g&&`.card[data-id="${g.id}"]`;
const find=(c,f,by)=>{const a=c.goals.filter(f);return a.length?(by?a.sort(by)[0]:rnd(a)):null};
const JOKES=[
  ['😹','I only chase one thing: the progress bar going up.'],
  ['😼',"Not saying skip the coffee. But I'm not not saying it."],
  ['😹','Cats sleep 16 hours a day. Saving is easier when you nap.'],
  ['😸','Psst. A coin a day keeps the broke away.'],
  ['😺','Small paws, small deposits, big results.'],
  ['😹',"I don't understand compound interest, but I respect it."],
  ['😼','Fun fact: knocking things off tables is free. Saving is better.']
];
const RULES=[
  /* home */
  {id:'h_empty',scr:'home',pri:9,cd:6e4,test:c=>!c.goals.length&&{},mood:'😺',msgs:["Hi, I'm Stashley! Make your first goal and I'll cheer you on.",'A fresh start. What are we saving for?'],sel:'.empty',mode:'in-br'},
  {id:'h_ded',scr:'home',pri:7,cd:9e5,test:c=>find(c,x=>x.i.ded>=2,(a,b)=>b.i.ded-a.i.ded),mood:'😿',msgs:['{name} has had {n} withdrawals in a row. Everything okay?','Those withdrawals from {name} are making me sad.'],sel:g=>CARD(g),mode:'in-br'},
  {id:'h_near',scr:'home',pri:6,cd:9e5,test:c=>find(c,x=>x.i.pct>=85&&x.i.rem>0,(a,b)=>b.i.pct-a.i.pct),mood:'😻',msgs:['{name} is at {pct}%. So close I can almost taste the tuna.','Just {rem} left on {name}. Finish it!'],sel:g=>CARD(g),mode:'in-br'},
  {id:'h_done',scr:'home',pri:5,cd:9e5,test:c=>find(c,x=>x.i.rem<=0),mood:'😻',msgs:['{name} is fully funded. Look at you go!','{name} is complete. I knew you could do it.'],sel:g=>CARD(g),mode:'in-br'},

  {id:'d_close',scr:'detail',pri:9,cd:3e5,test:c=>c.i.daysLeft!=null&&c.i.daysLeft>0&&c.i.daysLeft<=7&&c.i.rem>0&&c.i.pct<90,mood:'🙀',msgs:[v=>v.days===1?'Today is the target date and {rem} is still left!':'Only {days} days left and {rem} to go. Deep breath.'],sel:'.note',mode:'above-r'},

  {id:'d_stale',scr:'detail',pri:6,cd:3e5,test:c=>c.i.since!=null&&c.i.since>=14&&c.i.rem>0,mood:'😿',msgs:['{since} days since your last deposit. {name} misses you.'],sel:'.acts',mode:'above-r'},

function pick(min,force){
  const c=ctx(),now=Date.now(),cands=[];
  for(const r of RULES){
    if(r.scr!=='*'&&r.scr!==c.scr)continue;
    if(r.pri<min)continue;
    let hit;try{hit=r.test(c)}catch{hit=null}
    if(!hit)continue;
    const g=c.scr==='detail'?c.g:hit.g,i=c.scr==='detail'?c.i:hit.i;
    const key=r.id+':'+(g?g.id:'');
    if(!force&&now-(seen[key]||0)<r.cd)continue;
    cands.push({r,g,i,key,score:r.pri+Math.random()*.9});
  }
  if(!cands.length)return null;
  if(force){const o=cands.filter(x=>x.key!==lastKey2);return rnd(o.length?o:cands)}
  return cands.sort((a,b)=>b.score-a.score)[0];
}
function deliver(p){
  const {r,g,i,key}=p,v=vars(g,i);
  let mood=r.mood,txt='';
  for(let t=0;t<4;t++){
    let m=rnd(r.msgs);if(typeof m==='function')m=m(v);
    if(Array.isArray(m)){mood=m[0];txt=fmt(m[1],v)}else{mood=r.mood;txt=fmt(m,v)}
    if(txt!==lastText)break;
  }
  seen[key]=Date.now();lastKey2=key;
  say({mood,msg:txt,sel:typeof r.sel==='function'?r.sel(g):r.sel,mode:r.mode,fx:r.fx});
}

/* ---- reacting to what the person just did (by diffing goal snapshots) ---- */
const snap=()=>{const m={};S.goals.forEach(g=>{m[g.id]={n:g.logs.length,s:saved(g),t:g.target,name:g.name}});return m};
let prevSnap=snap(),lastNavKey=location.hash||'#';
function diff(a,b){
  const ev=[];
  for(const id in b){
    const n=b[id],o=a[id];
    if(!o)ev.push({t:'created',id});
    else if(n.n-o.n===1)ev.push({t:'added',id,o,n});
    else if(n.n<o.n)ev.push({t:'removed',id});
    else if(n.n===o.n&&n.t!==o.t)ev.push({t:'target',id,up:n.t>o.t});
  }
  for(const id in a)if(!b[id])ev.push({t:'deleted',name:a[id].name});
  return ev;
}
function react(e){
  const g=S.goals.find(x=>String(x.id)===e.id),onDetail=location.hash.startsWith('#g/');
  const sel=g?(onDetail?'.bar.lg':CARD(g)):null,mode=onDetail?'above-r':'in-br';
  const go=(mood,txt,v,fx)=>say({mood,msg:fmt(txt,Object.assign(vars(g),v||{})),sel,mode,fx});
  if(e.t==='created')return go(...rnd([['😸',"New goal: {name}! I'm already excited. First deposit?"],['😺',"{name}, huh? Good taste. Let's get it funded."]]));
  if(e.t==='deleted')return say({mood:rnd(['😿','🙀']),msg:fmt(rnd(['Goodbye, {name}. Plans change, it happens.','Poof! {name} is gone.']),{name:short(e.name)})});
  if(e.t==='removed')return go(...rnd([['😼',"Rewriting history, are we? I won't tell."],['🙀','That entry vanished! Hope you meant to do that.']]));
  if(e.t==='target')return e.up?go('😼','A bigger target? Ambitious. I like it.'):go('😼','Lowering the target? No judgement... okay, a little judgement.');
  if(e.t==='added'){
    const L=g.logs[g.logs.length-1],a=L.amt,abs=Math.abs(a),after=e.n.s,before=e.o.s;
    const pb=before/g.target*100,pa=after/g.target*100,v={amt:money(abs,g.currency)};
    if(a>0){
      const ms=[75,50,25].find(m=>pb<m&&pa>=m);
      if(after>=g.target&&before<g.target)return go('😻',rnd(['GOAL REACHED! {name} is fully funded. Zoomies time!','{name} is complete! I am so proud of you.']),v,'confetti');
      if(ms)return go('😻','{m}% of {name}! Keep purring along.',{...v,m:ms},'sparkle');
      if(e.n.n===1)return go('😻','Your very first deposit into {name}! A star is born.',v);
      if(abs<=g.target*.01)return go('😹','{amt}? Tiny but mighty. Every coin counts.',v);
      if(abs>=g.target*.2)return go('🙀','Whoa, {amt} in one go! Who are you and what did you do with the old you?',v);
      return go(...rnd([['😽','Thank you! {amt} added to {name}.'],['😸','Nice one. {pct}% there now.'],['😽',"That's the stuff. {rem} to go."]]).concat([v]));
    }
    lastDed=Date.now();
    let ded=0;for(const l of sorted(g)){if(l.amt<0)ded++;else break}
    if(after<=0&&before>0)return go('🙀','{name} is empty now! What happened?!',v);
    if(ded>=3)return go('😾','{n} withdrawals in a row. I am getting grumpy.',Object.assign({},v,{n:ded}));
    if(before>0&&abs>=before*.5)return go('🙀','Whoa, that is a big withdrawal from {name}. Everything okay?',v);
    return go(...rnd([['😿','{amt} taken out of {name}. It happens. Let us build it back.'],['😿',"Withdrawal noted. I'll pretend I didn't see that."]]).concat([v]));
  }
}
function afterRender(){
  const now=snap(),acted=Date.now()-lastAct<12000,key=location.hash||'#';
  const evs=acted?diff(prevSnap,now):[];
  prevSnap=now;
  const nav=key!==lastNavKey;lastNavKey=key;
  syncBtn();
  if(!SG.on)return;
  if(evs.length===1){clearTimeout(ct);react(evs[0]);return}
  if(nav){tok++;clearTimeout(bt);clearTimeout(homeT);hideBubble();scheduleConsider();return}
  reposition();
}
function scheduleConsider(){
  clearTimeout(ct);
  ct=setTimeout(()=>{
    if(!SG.on||dialogOpen()||document.hidden||Date.now()-lastSay<5000)return;
    const p=pick(3);if(p)deliver(p);
  },1300);
}
new MutationObserver(()=>{clearTimeout(rt);rt=setTimeout(afterRender,90)}).observe(document.querySelector('#view'),{childList:true});
['pointerdown','keydown','submit'].forEach(t=>document.addEventListener(t,()=>{lastAct=Date.now()},true));

/* ---- dialogs: perch on top of them, react to Deduct ---- */
['#gd','#cd'].forEach(s=>{
  const d=document.querySelector(s);
  new MutationObserver(()=>{
    if(d.open){
      if(!SG.on||!shown)return;
      tok++;clearTimeout(bt);clearTimeout(homeT);hideBubble();
      setTimeout(async()=>{
        if(!d.open)return;
        raise();cur.sel=s;cur.mode='above-r';
        const p=spot(s,'above-r');await flyTo(p.x,p.y);
      },380);
    }else{
      setTimeout(()=>{if(!dialogOpen()&&!bubbleOn&&Date.now()-lastSay>1500)goHome()},450);
    }
  }).observe(d,{attributes:true,attributeFilter:['open']});
});
document.querySelector('#cf').addEventListener('change',e=>{
  if(!e.target||e.target.name!=='ct')return;
  const c=ctx(),v=vars(c.g,c.i);
  if(e.target.value==='deduct')say({mood:'🙀',msg:fmt(rnd(['Taking money out? Are you sure about that?','A withdrawal? Think of {name}!']),v),sel:'#cd',mode:'above-r'});
  else say({mood:'😸',msg:"Back to adding. That's the spirit!",sel:'#cd',mode:'above-r'});
});

/* ---- reminders, taps, toggle ---- */
const _toast=toast;
toast=function(m){
  _toast.apply(this,arguments);
  if(typeof m==='string'&&m.startsWith('Time to save for ')&&SG.on&&!dialogOpen()){
    const g=S.goals.find(x=>m==='Time to save for '+x.name+' 💰');
    say({mood:'😾',msg:g?fmt(rnd(['Psst! It is saving time for {name}.','{name} is waiting. Chop chop!']),{name:short(g.name)}):'Psst! It is saving time.'});
  }
};
el.querySelector('.sg-cat').addEventListener('click',()=>{
  if(!SG.on)return;
  const n=Date.now();taps=taps.filter(t=>n-t<6000);taps.push(n);
  if(taps.length>=8){taps=[];say({mood:'😹',msg:"Okay okay, I'm ticklish!",sel:cur.sel,mode:cur.mode,fx:'zoom'});return}
  const p=pick(1,true);if(p)deliver(p);
});
function syncBtn(){
  const b=document.querySelector('#mascotBtn');
  if(b){b.textContent='Stashley: '+(SG.on?'on':'off');b.setAttribute('aria-pressed',SG.on)}
}
function toggle(){
  SG.on=!SG.on;
  try{localStorage.setItem('stash.mascot',SG.on?'on':'off')}catch{}
  syncBtn();
  if(SG.on)say({mood:'😻',msg:"I'm back! Did you miss me?"});
  else{say({mood:'😿',msg:"Okay, I'll go nap. Wake me anytime.",force:true});setTimeout(()=>{if(!SG.on)hideAll()},2800)}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.dataset.a==='mascot')toggle();
  else if(t.dataset.a==='exp'&&SG.on)say({mood:'😸',msg:rnd(['Backup saved. Smart cat.','Backup downloaded. Future you says thanks.']),sel:cur.sel,mode:cur.mode});
});
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(reposition,100)});
addEventListener('scroll',()=>{if(flying||!shown)return;cancelAnimationFrame(reposition.f);reposition.f=requestAnimationFrame(reposition)},{passive:true});

/* ---- occasional idle chatter ---- */
function idleTick(){
  clearTimeout(idleT);
  idleT=setTimeout(()=>{
    if(SG.on&&!document.hidden&&!dialogOpen()&&Date.now()-lastAct>20000&&Date.now()-lastSay>30000){const p=pick(1);if(p)deliver(p)}
    idleTick();
  },50000+Math.random()*40000);
}
syncBtn();idleTick();
if(SG.on)setTimeout(scheduleConsider,500);
})();
</script>
